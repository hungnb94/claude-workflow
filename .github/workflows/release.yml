name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Manual version bump override'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Automated Release on PR Merge
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Determine version bump and update manifests
        id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BUMP_TYPE_OVERRIDE: ${{ inputs.bump_type }}
        run: |
          python3 scripts/bump-version.py --write-manifests

      - name: Run pre-release integrity gate
        if: steps.bump.outputs.should_release == 'true'
        run: |
          python3 scripts/verify-integrity.py --check-tag "v${{ steps.bump.outputs.next_version }}"

      - name: Commit manifests, tag, and push atomically
        if: steps.bump.outputs.should_release == 'true'
        env:
          TAG: v${{ steps.bump.outputs.next_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG} [skip ci]"
            git pull --rebase origin main
          else
            echo "Manifest files are already up-to-date; skipping commit."
          fi
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"

      - name: Publish GitHub Release
        if: steps.bump.outputs.should_release == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.bump.outputs.next_version }}
          name: Release v${{ steps.bump.outputs.next_version }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Generate release summary
        if: always()
        run: |
          echo "## Release Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Merged**: ${{ github.event.pull_request.merged || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type**: ${{ steps.bump.outputs.bump_type || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Base Version**: ${{ steps.bump.outputs.base_version || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Version**: ${{ steps.bump.outputs.next_version || 'None' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Released**: ${{ steps.bump.outputs.should_release || 'false' }}" >> $GITHUB_STEP_SUMMARY
